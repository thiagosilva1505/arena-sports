name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure backend URL
        env:
          API_BASE_URL: ${{ vars.ARENA_API_BASE_URL }}
        run: |
          node -e 'const fs=require("node:fs"); const raw=process.env.API_BASE_URL.trim(); const value=raw.replace(/\/+$/, ""); if(value && new URL(value).protocol!=="https:") throw new Error("ARENA_API_BASE_URL must use HTTPS"); fs.writeFileSync("public/api-config.js", `window.ARENA_API_BASE_URL=${JSON.stringify(value)};\n`);'

      - name: Prepare static site
        run: touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
